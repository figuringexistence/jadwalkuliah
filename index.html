    <script src="dosen.js"></script>

    <script>
        let currentFilterHari = "Semua";
        let currentFilterRuang = "Semua";

        function switchTab(tab) {
            const viewJadwal = document.getElementById("viewJadwal");
            const viewDosen = document.getElementById("viewDosen");
            const btnJadwal = document.getElementById("tabJadwalBtn");
            const btnDosen = document.getElementById("tabDosenBtn");

            if (tab === 'jadwal') {
                viewJadwal.style.display = "block";
                viewDosen.style.display = "none";
                btnJadwal.style.backgroundColor = "#3b82f6";
                btnJadwal.style.color = "white";
                btnDosen.style.backgroundColor = "transparent";
                btnDosen.style.color = "#a0aec0";
            } else {
                viewJadwal.style.display = "none";
                viewDosen.style.display = "block";
                btnDosen.style.backgroundColor = "#3b82f6";
                btnDosen.style.color = "white";
                btnJadwal.style.backgroundColor = "transparent";
                btnJadwal.style.color = "#a0aec0";
                renderDosen();
            }
        }

        function getActiveUser() {
            let user = localStorage.getItem("unimugoActiveUser");
            if (!user) {
                user = "user_" + Math.random().toString(36).substring(2, 9);
                localStorage.setItem("unimugoActiveUser", user);
            }
            return user;
        }

        async function cekHakAksesTambah() {
            const containerBtn = document.getElementById("btnTambahContainer");
            const currentUser = getActiveUser();
            const hasAuthToken = localStorage.getItem("unimugoIsCreator");

            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "jadwalKuliah"));
                let isCreator = hasAuthToken === "true";

                querySnapshot.forEach((d) => {
                    const data = d.data();
                    if (data.createdBy === currentUser) {
                        isCreator = true;
                    }
                });

                if (isCreator) {
                    containerBtn.innerHTML = `
                        <a href="input.html" style="background-color: #22c55e; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: bold; display: inline-flex; align-items: center; gap: 6px;">
                            <i class="fa-solid fa-plus"></i> Tambah Jadwal Baru
                        </a>
                    `;
                } else {
                    containerBtn.innerHTML = "";
                }
            } catch (e) {
                console.error("Gagal cek hak akses:", e);
                containerBtn.innerHTML = "";
            }
        }

        async function ambilDataJadwalOnline() {
            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "jadwalKuliah"));
                let daftarJadwal = [];
                const sekarang = new Date();

                querySnapshot.forEach((d) => {
                    const item = { id: d.id, ...d.data() };
                    
                    if (item.tanggal && item.jam) {
                        try {
                            const parts = item.jam.split("-");
                            if (parts.length >= 2) {
                                const jamSelesaiStr = parts[1].trim().replace(".", ":");
                                const waktuSelesaiKuliah = new Date(`${item.tanggal}T${jamSelesaiStr}:00`);
                                if (sekarang > waktuSelesaiKuliah) {
                                    window.deleteDoc(window.doc(window.db, "jadwalKuliah", item.id));
                                    return;
                                }
                            }
                        } catch (e) {}
                    }
                    daftarJadwal.push(item);
                });

                return daftarJadwal;
            } catch (error) {
                console.error("Gagal mengambil data online:", error);
                return [];
            }
        }

        document.addEventListener("firebase-loaded", async () => {
            await cekHakAksesTambah();
        });
